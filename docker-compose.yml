services:
  superops-docs-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superops-docs-mcp
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - SUPEROPS_API_TOKEN=${SUPEROPS_API_TOKEN}
      - SUPEROPS_SUBDOMAIN=${SUPEROPS_SUBDOMAIN:-infinitysolutions}
      - SUPEROPS_REGION=${SUPEROPS_REGION:-us}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8082/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s